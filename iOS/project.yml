name: Feeledger
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: W7Q885Q59C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Feeledger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Feeledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.feeledger
        DEVELOPMENT_TEAM: W7Q885Q59C
        INFOPLIST_FILE: Feeledger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    info:
      path: Feeledger/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Feeledger
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Feeledger/Feeledger.entitlements
      properties: {}
  FeeledgerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FeeledgerTests
    dependencies:
      - target: Feeledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.feeledger.tests
        DEVELOPMENT_TEAM: W7Q885Q59C
  FeeledgerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FeeledgerUITests
    dependencies:
      - target: Feeledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.feeledger.uitests
        DEVELOPMENT_TEAM: W7Q885Q59C
schemes:
  Feeledger:
    build:
      targets:
        Feeledger: all
    test:
      targets:
        - FeeledgerTests
        - FeeledgerUITests
    run:
      config: Debug
